services:
  fairroute:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  api:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: sh -c "pip install -r requirements.txt && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    profiles: ["api"]
